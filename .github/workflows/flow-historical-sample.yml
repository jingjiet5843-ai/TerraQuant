name: Hyperliquid actual orderflow backtest
on:
  push:
    paths:
      - '.github/workflows/flow-historical-sample.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install numeric / parquet dependencies
        run: pip install -q pandas numpy pyarrow requests
      - name: Download and backtest authentic historical trades and L2 snapshots
        run: python research/orderflow/free_hour_backtest.py
      - name: Commit source-derived results
        shell: bash
        run: |
          git config user.name 'terraquant-research-bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/orderflow/first-real-backtest.json research/orderflow/first-real-backtest.md
          git commit -m 'research: publish genuine 1-hour Hyperliquid orderflow backtest' || true
          git push
      - name: Upload research files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hyperliquid-actual-flow-backtest
          path: |
            research/orderflow/first-real-backtest.json
            research/orderflow/first-real-backtest.md
