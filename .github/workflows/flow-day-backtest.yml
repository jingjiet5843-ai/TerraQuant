name: Hyperliquid 24-hour orderflow backtest
on:
  push:
    paths:
      - '.github/workflows/flow-day-backtest.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 24
    steps:
      - uses: actions/checkout@v4
      - name: Install data analysis dependencies
        run: pip install -q pandas numpy pyarrow requests
      - name: Run full-day historical research and capture failures
        shell: bash
        run: |
          set +e
          python -u research/orderflow/one_day_backtest.py > research/orderflow/day-run.log 2>&1
          CODE=$?
          printf '%s\n' "$CODE" > research/orderflow/day-exit-code.txt
          tail -n 25 research/orderflow/day-run.log
          exit "$CODE"
      - name: Commit diagnostic and any results
        if: always()
        run: |
          git config user.name 'terraquant-research-bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/orderflow/day-run.log research/orderflow/day-exit-code.txt || true
          git add research/orderflow/first-real-day-backtest.json research/orderflow/first-real-day-backtest.md || true
          git commit -m 'research: save full-day screening result or diagnostic' || true
          git push
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hyperliquid-btc-day-backtest
          path: |
            research/orderflow/day-run.log
            research/orderflow/day-exit-code.txt
            research/orderflow/first-real-day-backtest.json
            research/orderflow/first-real-day-backtest.md
